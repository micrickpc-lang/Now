worker_processes 1;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  etag on;

  # Log only the normalized path. Query strings, client IPs, bodies, cookies,
  # authorization headers and upstream payloads are deliberately excluded.
  log_format safe_json escape=json
    '{"time":"$time_iso8601","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"request_id":"$request_id"}';
  access_log /dev/stdout safe_json;
  # Request-bearing upstream errors can contain query strings. Healthchecks and
  # access status remain observable; only process-critical errors reach stderr.
  error_log /dev/stderr crit;

  limit_req_status 429;
  limit_req_zone $binary_remote_addr zone=api_per_ip:4m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:2m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=search_per_ip:2m rate=3r/s;
  limit_req_zone $binary_remote_addr zone=tiles_per_ip:2m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=socket_per_ip:2m rate=5r/s;
  limit_conn_zone $binary_remote_addr zone=connections_per_ip:2m;

  proxy_cache_path /var/cache/nginx/maps
    levels=1:2
    keys_zone=map_tiles:8m
    max_size=256m
    inactive=14d
    use_temp_path=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream api_upstream {
    server api:3000;
    keepalive 16;
  }

  server {
    listen 8080 default_server;
    server_name _;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn connections_per_ip 40;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /_edge/health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}\n';
    }

    location = /health {
      access_log off;
      proxy_pass http://api_upstream/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
    }

    location = /ready {
      access_log off;
      proxy_pass http://api_upstream/ready;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
    }

    location ~ ^/api/v1/auth/(otp/request|otp/verify)$ {
      limit_req zone=auth_per_ip burst=3 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
    }

    location ~ ^/api/v1/maps/(search|reverse)$ {
      limit_req zone=search_per_ip burst=5 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 10s;
    }

    # Mobile uses the stable API URL. Serve the canonical versioned style here
    # as well so its tile, sprite and glyph graph is identical to /maps/v1.
    location = /api/v1/maps/style.json {
      alias /srv/maps/v1/style.json;
      default_type application/json;
      add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    location = /maps/v1/style.json {
      alias /srv/maps/v1/style.json;
      default_type application/json;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /maps/v1/sprites/ {
      alias /srv/maps/v1/sprites/;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /maps/v1/glyphs/ {
      alias /srv/maps/v1/glyphs/;
      default_type application/x-protobuf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~ ^/maps/v1/tiles/(?<tile_z>[0-9]{1,2})/(?<tile_x>[0-9]+)/(?<tile_y>[0-9]+)\.pbf$ {
      limit_req zone=tiles_per_ip burst=100 nodelay;
      rewrite ^ /api/v1/maps/tiles/$tile_z/$tile_x/$tile_y.pbf break;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_cache map_tiles;
      proxy_cache_key "maps-v1|$tile_z|$tile_x|$tile_y";
      proxy_cache_methods GET HEAD;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 1m;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header X-Map-Cache $upstream_cache_status always;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location ~ ^/api/v1/maps/tiles/(?<api_tile_z>[0-9]{1,2})/(?<api_tile_x>[0-9]+)/(?<api_tile_y>[0-9]+)\.pbf$ {
      limit_req zone=tiles_per_ip burst=100 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_set_header Authorization "";
      proxy_set_header Cookie "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 15s;
      proxy_cache map_tiles;
      proxy_cache_key "maps-v1|$api_tile_z|$api_tile_x|$api_tile_y";
      proxy_cache_methods GET HEAD;
      proxy_cache_lock on;
      proxy_cache_background_update on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_valid 200 7d;
      proxy_cache_valid 404 1m;
      proxy_ignore_headers Set-Cookie;
      proxy_hide_header Set-Cookie;
      add_header X-Map-Cache $upstream_cache_status always;
      add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # Socket.IO uses /socket.io for its transport even though the namespace is
    # /realtime. Keep /realtime for clients configured with a custom path.
    location /socket.io/ {
      limit_req zone=socket_per_ip burst=10 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location /realtime/ {
      limit_req zone=socket_per_ip burst=10 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

    location /docs {
      limit_req zone=api_per_ip burst=10 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Proxy "";
    }

    location / {
      default_type application/json;
      return 404 '{"statusCode":404,"message":"Not Found"}\n';
    }
  }
}
